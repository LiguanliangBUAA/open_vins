# IMAV 2026 arena landmark points, in the `earth` frame.
#
# Consumed by imav2026_perception/landmark_projector.py, which projects every point
# into each configured camera and publishes the visible ones as
# imav2026_msgs/KeypointObservationArray on perception/keypoints/<camera>.
#
# ---------------------------------------------------------------------------
# KEEP IN SYNC BY HAND with launchers/common/gz_models/worlds/imav2026_indoor.sdf
# and the per-model SDFs it includes. Every coordinate below is derived from
# them; the derivation is shown in the comment above each group so a change in
# the world can be traced to the numbers here.
# ---------------------------------------------------------------------------
#
# ID blocks (globally unique, stable across runs):
#   1000-1999  aruco corner              1000 + marker_id * 4 + corner_idx
#   2000-2999  gate opening corner       2000 + opening_idx * 4 + corner_idx
#   3000-3999  horizontal tube endpoint  3000 + tube_idx * 2 + end_idx
#   4000-4999  vertical tube endpoint    4000 + tube_idx * 2 + end_idx
#
# Fields per point:
#   id      globally unique uint32
#   name    human-readable, shown in the debug overlay and RViz text markers
#   xyz     position in the earth frame, metres
#   normal  (optional) outward surface normal, earth frame. When present the
#           projector applies a facing test: the point is only reported if the
#           normal points back towards the camera. Used for planar markers and
#           gate openings; omitted for tube endpoints, which are visible from
#           any direction.
#   object  (optional) the physical object the point belongs to, e.g. gate1_blue.
#           Groups the points the landmark detector reports together (4 gate
#           corners, 2 bar ends). Required whenever `type` is set.
#   type    (optional) the landmark detector class that object is detected as:
#           gate_blue | gate_red | bar_red | bar_blue. Points without a type are
#           never published from the detector (ArUco has its own detector; the
#           pipes are out of scope). The loader checks each typed object has the
#           type's point count and that the type matches the id's class block.

